# CareHub – local reverse proxy (http://localhost only, no TLS).
events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS, so containers can restart without breaking nginx.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        client_max_body_size 50M;
        underscores_in_headers on;

        set $appflowy_cloud_backend "http://appflowy_cloud:8000";
        set $gotrue_backend "http://gotrue:9999";
        set $appflowy_web_backend "http://appflowy_web:80";
        set $minio_api_backend "http://minio:9000";
        set $minio_internal_host "minio:9000";

        # Sign-in service
        location /gotrue/ {
            proxy_pass $gotrue_backend;
            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }

        # Live editing (WebSocket)
        location /ws {
            proxy_pass $appflowy_cloud_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Server API
        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;

            # Notion / zip imports can be large.
            location /api/import {
                proxy_pass $appflowy_cloud_backend;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                client_max_body_size 2G;
            }
        }

        # File uploads/downloads (pre-signed links)
        location /minio-api/ {
            proxy_pass $minio_api_backend;
            proxy_set_header Host $minio_internal_host;
            rewrite ^/minio-api/(.*) /$1 break;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            client_max_body_size 0;
        }

        # Web app
        location / {
            proxy_pass $appflowy_web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Scheme $scheme;
        }
    }
}
