# CareHub – local test setup (fictional data only).
#
# Everything here is either built from our own private source code
# (carehub-server, carehub-worker, carehub-web) or is a standard open-source
# image (postgres, redis, minio, nginx, supabase/auth).
# No commercial AppFlowy images, no AI and no search services.
#
# First time:   sh setup.sh            (creates .env with random passwords)
# Start:        docker compose up -d
# Stop:         docker compose down    (your data is kept)
# Wipe data:    docker compose down -v (deletes ALL CareHub data)
#
# Web address: set CAREHUB_URL / CAREHUB_WS_URL in .env (default http://localhost),
# e.g. CAREHUB_URL=https://my-mac.tailnet-name.ts.net  CAREHUB_WS_URL=wss://my-mac.tailnet-name.ts.net

name: carehub

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CAREHUB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - appflowy_cloud
      - appflowy_web
      - gotrue

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Run "sh setup.sh" first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-carehub-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  minio:
    # minio/minio is no longer published on Docker Hub; pgsty/minio is a maintained open-source (AGPL) build.
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-carehub}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?Run "sh setup.sh" first}
    volumes:
      - minio_data:/data

  # Open-source sign-in service (MIT licence).
  gotrue:
    image: ${CAREHUB_AUTH_IMAGE:-supabase/auth:v2.164.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - PORT=9999
      - API_EXTERNAL_URL=${CAREHUB_URL:-http://localhost}/gotrue
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?search_path=auth
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?search_path=auth
      - GOTRUE_DB_NAMESPACE=auth
      - GOTRUE_SITE_URL=${CAREHUB_URL:-http://localhost}
      - GOTRUE_URI_ALLOW_LIST=${CAREHUB_URL:-http://localhost}/**,http://localhost/**
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:?Run "sh setup.sh" first}
      - GOTRUE_JWT_EXP=604800
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_ADMIN_ROLES=supabase_admin,service_role
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      # Local testing: accounts are confirmed automatically (no e-mail needed).
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@carehub.local
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=100
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  appflowy_cloud:
    image: ghcr.io/felipe01-nav/carehub-server:${CAREHUB_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotrue:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_BASE_URL=${CAREHUB_URL:-http://localhost}
      - APPFLOWY_WEB_URL=${CAREHUB_URL:-http://localhost}
      - APPFLOWY_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=20
      - APPFLOWY_REDIS_URI=redis://redis:6379
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - APPFLOWY_ACCESS_CONTROL=true
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_CREATE_BUCKET=true
      - APPFLOWY_S3_MINIO_URL=http://minio:9000
      - APPFLOWY_S3_ACCESS_KEY=${MINIO_USER:-carehub}
      - APPFLOWY_S3_SECRET_KEY=${MINIO_PASSWORD}
      - APPFLOWY_S3_BUCKET=appflowy
      - APPFLOWY_S3_REGION=us-east-1
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=${CAREHUB_URL:-http://localhost}/minio-api
      # E-mail is not set up for local testing (placeholders only).
      - APPFLOWY_MAILER_SMTP_HOST=smtp.invalid
      - APPFLOWY_MAILER_SMTP_PORT=465
      - APPFLOWY_MAILER_SMTP_USERNAME=noreply@carehub.local
      - APPFLOWY_MAILER_SMTP_EMAIL=noreply@carehub.local
      - APPFLOWY_MAILER_SMTP_PASSWORD=unused
      - APPFLOWY_MAILER_SMTP_TLS_KIND=wrapper
      # AI and search are switched off.
      - AI_ENABLED=false
      - AI_SERVER_HOST=localhost
      - AI_SERVER_PORT=5001
      - AI_OPENAI_API_KEY=
      - APPFLOWY_INDEXER_ENABLED=false
      - APPFLOWY_SEARCH_SERVICE_URL=http://localhost:4002
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30

  # Background jobs, e.g. importing a Notion export.
  appflowy_worker:
    image: ghcr.io/felipe01-nav/carehub-worker:${CAREHUB_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_started
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_WORKER_ENVIRONMENT=production
      - APPFLOWY_WORKER_REDIS_URL=redis://redis:6379
      - APPFLOWY_WORKER_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - APPFLOWY_WORKER_DATABASE_NAME=postgres
      - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://minio:9000
      - APPFLOWY_S3_ACCESS_KEY=${MINIO_USER:-carehub}
      - APPFLOWY_S3_SECRET_KEY=${MINIO_PASSWORD}
      - APPFLOWY_S3_BUCKET=appflowy
      - APPFLOWY_S3_REGION=us-east-1
      - APPFLOWY_MAILER_SMTP_HOST=smtp.invalid
      - APPFLOWY_MAILER_SMTP_PORT=465
      - APPFLOWY_MAILER_SMTP_USERNAME=noreply@carehub.local
      - APPFLOWY_MAILER_SMTP_EMAIL=noreply@carehub.local
      - APPFLOWY_MAILER_SMTP_PASSWORD=unused
      - APPFLOWY_MAILER_SMTP_TLS_KIND=wrapper

  appflowy_web:
    image: ghcr.io/felipe01-nav/carehub-web:${CAREHUB_WEB_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - APPFLOWY_BASE_URL=${CAREHUB_URL:-http://localhost}
      - APPFLOWY_GOTRUE_BASE_URL=${CAREHUB_URL:-http://localhost}/gotrue
      - APPFLOWY_WS_BASE_URL=${CAREHUB_WS_URL:-ws://localhost}/ws/v2

  # Automatic backups: database + uploaded files, every day, kept for 14 days.
  # They land in the "backups" folder next to this file (~/carehub/backups).
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      - BACKUP_EVERY_HOURS=${BACKUP_EVERY_HOURS:-24}
    volumes:
      - ./backups:/backups
      - minio_data:/minio:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        echo "CareHub backup service started"
        while true; do
          stamp=$$(date +%Y-%m-%d_%H%M)
          if pg_dump -h postgres -U postgres -d postgres -Fc -f /backups/carehub-db-$$stamp.dump.part; then
            mv /backups/carehub-db-$$stamp.dump.part /backups/carehub-db-$$stamp.dump
            tar -czf /backups/carehub-files-$$stamp.tar.gz -C /minio . && echo "Backup OK: $$stamp"
          else
            rm -f /backups/carehub-db-$$stamp.dump.part
            echo "Backup FAILED: $$stamp"
          fi
          find /backups -name 'carehub-*' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep $$(( BACKUP_EVERY_HOURS * 3600 ))
        done

volumes:
  postgres_data:
  redis_data:
  minio_data:
